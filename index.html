<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPLIT</title>
<meta name="description" content="מכניסים שמות ומחלקים לקבוצות, או בוחרים אדם אחד באקראי.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SPLIT">
<meta property="og:title" content="SPLIT">
<meta property="og:description" content="מכניסים שמות ומחלקים לקבוצות, או בוחרים אדם אחד באקראי.">
<meta property="og:url" content="https://nimrodyaroker.github.io/team-picker/">
<meta property="og:image" content="https://nimrodyaroker.github.io/team-picker/og-image.jpg?v=5">
<meta property="og:image:secure_url" content="https://nimrodyaroker.github.io/team-picker/og-image.jpg?v=5">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://nimrodyaroker.github.io/team-picker/og-image.jpg?v=5">
<link rel="icon" type="image/svg+xml" href="logo.svg?v=5">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<meta name="theme-color" content="#07070c">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="SPLIT">
<meta name="application-name" content="SPLIT">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070c;
    --lime: #c6ff3d;
    --pink: #ff3d8b;
    --cyan: #3de1ff;
    --violet: #8b5cff;
    --glass: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Rubik', system-ui, sans-serif;
    background: var(--bg); color: #fff;
    min-height: 100vh; overflow-x: hidden;
    display: flex; justify-content: center; padding: 40px 16px 60px;
  }

  /* רקע: כתמי צבע זזים */
  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: -1; animation: float 14s ease-in-out infinite alternate; }
  .b1 { width: 380px; height: 380px; background: var(--violet); top: -120px; right: -100px; }
  .b2 { width: 320px; height: 320px; background: var(--pink); bottom: -100px; left: -80px; animation-delay: -5s; }
  .b3 { width: 240px; height: 240px; background: var(--cyan); top: 40%; left: 55%; opacity: .25; animation-delay: -9s; }
  @keyframes float { to { transform: translate(60px, 80px) scale(1.15); } }

  .app { width: 100%; max-width: 460px; }

  .logo {
    font-size: 64px; font-weight: 900; letter-spacing: -2px; text-align: center; line-height: 1;
    background: linear-gradient(90deg, var(--lime), var(--cyan), var(--pink), var(--lime));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  .tag { text-align: center; color: rgba(255,255,255,.55); margin: 10px 0 28px; font-size: 15px; }

  .glass {
    background: var(--glass); border: 1px solid var(--line); border-radius: 24px;
    padding: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }

  /* בורר מצב */
  .modes {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 16px; padding: 4px; margin-bottom: 16px;
  }
  .modes .pill {
    position: absolute; top: 4px; bottom: 4px; right: 4px; width: calc(50% - 4px);
    border-radius: 12px; background: linear-gradient(90deg, var(--lime), var(--cyan));
    transition: transform .35s cubic-bezier(.3,1.4,.5,1);
  }
  .modes.pick .pill { transform: translateX(-100%); background: linear-gradient(90deg, var(--pink), var(--violet)); }
  .modes button {
    position: relative; z-index: 1; border: none; background: none; color: rgba(255,255,255,.6);
    font: inherit; font-weight: 800; font-size: 15px; padding: 12px; cursor: pointer; transition: color .25s;
  }
  .modes button.on { color: #000; }
  .modes.pick button.on { color: #fff; }

  .opt { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 14px; color: rgba(255,255,255,.6); }
  .numwrap { display: flex; align-items: center; gap: 10px; }
  .hint { font-size: 12px; color: rgba(255,255,255,.35); }
  input.numbox {
    flex: none; width: 56px; padding: 8px 0; text-align: center;
    font-size: 18px; font-weight: 800; border-radius: 12px;
  }
  input.numbox.bump { animation: bump .4s; border-color: var(--pink); }
  @keyframes bump { 30% { transform: scale(1.15); } }

  .input-row { display: flex; gap: 8px; }
  input {
    flex: 1; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 14px;
    color: #fff; font: inherit; font-size: 16px; padding: 14px 16px; outline: none; transition: .2s;
  }
  input::placeholder { color: rgba(255,255,255,.35); }
  input:focus { border-color: var(--lime); box-shadow: 0 0 0 4px rgba(198,255,61,.15); }

  .add {
    width: 52px; border: none; border-radius: 14px; cursor: pointer;
    background: var(--lime); color: #000; font-size: 26px; font-weight: 800; transition: .15s;
  }
  .add:hover { transform: scale(1.06) rotate(90deg); }
  .add:active { transform: scale(.92); }

  .meta { display: flex; justify-content: space-between; align-items: center; margin: 16px 2px 10px; font-size: 13px; color: rgba(255,255,255,.5); }
  .count { color: var(--lime); font-weight: 800; }
  .clear { background: none; border: none; color: rgba(255,255,255,.45); font: inherit; font-size: 13px; cursor: pointer; }
  .clear:hover { color: var(--pink); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.08); border: 1px solid var(--line);
    padding: 8px 10px 8px 14px; border-radius: 999px; font-size: 15px;
    animation: pop .35s cubic-bezier(.3,1.6,.5,1); transition: background .08s, transform .08s, color .08s;
  }
  .chip.hot { background: var(--pink); border-color: var(--pink); color: #fff; transform: scale(1.12); box-shadow: 0 0 24px var(--pink); }
  .chip.dim { opacity: .3; }
  .chip button { background: none; border: none; color: inherit; opacity: .5; cursor: pointer; font-size: 14px; }
  .chip button:hover { opacity: 1; }
  .empty { color: rgba(255,255,255,.3); font-size: 14px; padding: 10px 2px; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }

  .go {
    width: 100%; margin-top: 18px; padding: 18px; border: none; border-radius: 18px;
    font: inherit; font-size: 20px; font-weight: 900; color: #000; cursor: pointer;
    background: linear-gradient(90deg, var(--lime), var(--cyan));
    box-shadow: 0 10px 40px -8px rgba(198,255,61,.6);
    transition: transform .15s, box-shadow .2s, background .3s;
  }
  .go.pick { color: #fff; background: linear-gradient(90deg, var(--pink), var(--violet)); box-shadow: 0 10px 40px -8px rgba(255,61,139,.7); }
  .go:hover { transform: translateY(-2px); }
  .go:active { transform: scale(.97); }
  .go:disabled { opacity: .6; cursor: wait; }
  .go.spin { animation: shake .5s; }
  @keyframes shake { 20%,60% { transform: rotate(-2deg); } 40%,80% { transform: rotate(2deg); } }

  /* תוצאה: קבוצות */
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .team { padding: 16px; position: relative; overflow: hidden; }
  .team::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); box-shadow: 0 0 20px var(--c); }
  .team h2 { font-size: 13px; letter-spacing: 2px; font-weight: 800; margin-bottom: 12px; color: var(--c); }
  .team ol { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .team li {
    background: rgba(255,255,255,.06); border-radius: 10px; padding: 10px 12px; font-weight: 600;
    opacity: 0; transform: translateY(14px); animation: drop .45s forwards;
  }
  @keyframes drop { to { opacity: 1; transform: none; } }

  /* תוצאה: נבחר אחד */
  .winner { margin-top: 20px; text-align: center; padding: 30px 18px; position: relative; overflow: hidden; }
  .winner::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--pink); box-shadow: 0 0 24px var(--pink); }
  .winner small { display: block; letter-spacing: 3px; font-size: 12px; font-weight: 800; color: var(--pink); margin-bottom: 10px; }
  .winner .who {
    font-size: 48px; font-weight: 900; line-height: 1.1; word-break: break-word;
    animation: boom .6s cubic-bezier(.3,1.8,.5,1);
  }
  @keyframes boom { from { transform: scale(.2); opacity: 0; } }

  .share {
    display: none; width: 100%; margin-top: 12px; padding: 14px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--glass); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; transition: .2s;
  }
  .share:hover { border-color: #25d366; color: #25d366; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 100px);
    background: var(--pink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 600;
    transition: transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  .toast.show { transform: translate(-50%, 0); }

  /* מצב בחירה: השורה העליונה מתקפלת והשמות הופכים לריבועים */
  .fold { max-height: 140px; transition: max-height .45s ease, opacity .3s ease, margin .45s ease, padding .45s ease, border-width .45s; }
  .picking .fold { max-height: 0; opacity: 0; margin: 0; padding-top: 0; padding-bottom: 0; border-width: 0; overflow: hidden; pointer-events: none; }
  .picking .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .picking .chip {
    justify-content: center; text-align: center; padding: 22px 10px; border-radius: 18px;
    font-size: 18px; font-weight: 800; animation: tile .45s cubic-bezier(.3,1.5,.5,1) backwards;
  }
  .picking .chip button { display: none; }
  @keyframes tile { from { transform: translateY(-30px) scale(.6); opacity: 0; } }

  canvas { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="confetti"></canvas>

<main class="app">
  <h1 class="logo">SPLIT</h1>
  <p class="tag">זורקים שמות, הגורל מחליט. בלי ויכוחים.</p>

  <section class="glass" id="panel">
    <div class="modes fold" id="modes">
      <div class="pill"></div>
      <button class="on" data-mode="teams" onclick="setMode('teams')">חלק לקבוצות</button>
      <button data-mode="pick" onclick="setMode('pick')">בחר אחד</button>
    </div>

    <div class="opt fold" id="teamsOpt">
      <span>כמה קבוצות?</span>
      <div class="numwrap">
        <span class="hint" id="hint"></span>
        <input id="teamNum" class="numbox" type="text" inputmode="numeric" maxlength="2" value="2" aria-label="מספר קבוצות">
      </div>
    </div>

    <div class="input-row fold">
      <input id="name" placeholder="הוסף שם…" autocomplete="off">
      <button class="add" onclick="addPlayer()" aria-label="הוסף">+</button>
    </div>
    <div class="meta fold">
      <span><span class="count" id="count">0</span> משתתפים</span>
      <button class="clear" onclick="clearAll()">נקה הכול</button>
    </div>
    <div class="chips" id="chips"></div>
    <button class="go fold" id="go" onclick="run()">תחלק אותנו</button>
  </section>

  <div id="result"></div>
  <button class="share" id="share" onclick="shareWhatsApp()">שלח לקבוצה בוואטסאפ</button>
</main>

<div class="toast" id="toast"></div>

<script>
  const TEAM_STYLE = [
    { name: 'TEAM BLUE',   he: 'כחולים', color: 'var(--cyan)' },
    { name: 'TEAM PINK',   he: 'ורודים', color: 'var(--pink)' },
    { name: 'TEAM LIME',   he: 'ירוקים', color: 'var(--lime)' },
    { name: 'TEAM VIOLET', he: 'סגולים', color: 'var(--violet)' },
  ];

  let players = load();
  let mode = 'teams';
  let teamCount = 2;
  let lastResult = null;
  let busy = false;

  const nameInput = document.getElementById('name');
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

  function load() {
    try { return JSON.parse(localStorage.getItem('split-players')) || []; } catch { return []; }
  }
  function save() {
    try { localStorage.setItem('split-players', JSON.stringify(players)); } catch {}
  }

  function setMode(m) {
    if (busy) return;
    mode = m;
    document.getElementById('modes').classList.toggle('pick', m === 'pick');
    document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    document.getElementById('teamsOpt').style.display = m === 'teams' ? 'flex' : 'none';
    const go = document.getElementById('go');
    go.classList.toggle('pick', m === 'pick');
    go.textContent = m === 'pick' ? 'מי זה יהיה?' : 'תחלק אותנו';
    clearResult();
  }

  /* מספר הקבוצות: רק ספרות, ובטווח הגיוני לפי כמות המשתתפים */
  const teamNum = document.getElementById('teamNum');
  function maxTeams() { return Math.max(2, Math.floor(players.length / 2)); }

  teamNum.addEventListener('input', () => {
    teamNum.value = teamNum.value.replace(/\D/g, '');
  });
  teamNum.addEventListener('change', fixTeams);
  teamNum.addEventListener('blur', fixTeams);
  teamNum.addEventListener('keydown', e => { if (e.key === 'Enter') teamNum.blur(); });

  function fixTeams() {
    const max = maxTeams();
    let n = parseInt(teamNum.value, 10);
    const wanted = n;
    if (isNaN(n) || n < 2) n = 2;
    if (n > max) n = max;
    teamNum.value = n;
    teamCount = n;
    if (!isNaN(wanted) && wanted !== n) {
      teamNum.classList.remove('bump'); void teamNum.offsetWidth; teamNum.classList.add('bump');
      if (wanted > max) toast(players.length < 4
        ? 'עם פחות מ-4 משתתפים אפשר רק 2 קבוצות'
        : `עם ${players.length} משתתפים אפשר עד ${max} קבוצות`);
    }
  }

  function updateHint() {
    document.getElementById('hint').textContent = `עד ${maxTeams()}`;
    if (teamCount > maxTeams()) { teamCount = maxTeams(); teamNum.value = teamCount; }
  }

  function addPlayer() {
    const name = nameInput.value.trim();
    if (!name) return;
    if (players.includes(name)) { toast('השם הזה כבר ברשימה'); return; }
    players.push(name);
    nameInput.value = '';
    nameInput.focus();
    save(); render();
  }

  function removePlayer(i) { if (busy) return; players.splice(i, 1); save(); render(); }

  function clearAll() {
    if (busy) return;
    players = []; save(); render(); clearResult();
  }

  function clearResult() {
    document.getElementById('result').innerHTML = '';
    document.getElementById('share').style.display = 'none';
    lastResult = null;
  }

  function render() {
    const box = document.getElementById('chips');
    box.innerHTML = '';
    if (!players.length) box.innerHTML = '<p class="empty">עוד אף אחד לא הגיע…</p>';
    players.forEach((p, i) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = p;
      const x = document.createElement('button');
      x.innerHTML = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      x.setAttribute('aria-label', 'הסר');
      x.onclick = () => removePlayer(i);
      chip.appendChild(x);
      box.appendChild(chip);
    });
    document.getElementById('count').textContent = players.length;
    updateHint();
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function run() {
    if (busy) return;
    if (mode === 'teams') makeTeams(); else pickOne();
  }

  /* מצב 1: חלוקה לקבוצות */
  function makeTeams() {
    fixTeams();
    if (players.length < 2) { toast('צריך לפחות 2 משתתפים'); return; }
    const btn = document.getElementById('go');
    btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');

    const mixed = shuffle(players);
    const teams = Array.from({ length: teamCount }, () => []);
    mixed.forEach((p, i) => teams[i % teamCount].push(p));
    lastResult = { type: 'teams', teams };

    const wrap = document.createElement('section');
    wrap.className = 'teams';
    teams.forEach((members, t) => {
      const s = TEAM_STYLE[t];
      const card = document.createElement('div');
      card.className = 'glass team';
      card.style.setProperty('--c', s.color);
      card.innerHTML = `<h2>${s.name}</h2><ol></ol>`;
      const ol = card.querySelector('ol');
      members.forEach((n, i) => {
        const li = document.createElement('li');
        li.textContent = n;
        li.style.animationDelay = (i * 0.12 + t * 0.06 + 0.1) + 's';
        ol.appendChild(li);
      });
      wrap.appendChild(card);
    });
    showResult(wrap);
  }

  /* מצב 2: בחירת אדם אחד, עם אנימציית רולטה */
  function pickOne() {
    if (players.length < 2) { toast('צריך לפחות 2 משתתפים'); return; }
    busy = true;
    clearResult();
    const go = document.getElementById('go');
    go.disabled = true;

    const panel = document.getElementById('panel');
    const chips = [...document.querySelectorAll('.chip')];
    chips.forEach((c, i) => c.style.animationDelay = (i * 0.05) + 's');
    panel.classList.add('picking');

    const winner = Math.floor(Math.random() * players.length);
    const rounds = 3 * players.length + winner; // כמה קפיצות עד העצירה
    let step = 0, delay = 50;

    setTimeout(hop, 650 + chips.length * 50); // מחכים שהריבועים ינחתו
    function hop() {
      chips.forEach(c => c.classList.remove('hot'));
      chips[step % chips.length].classList.add('hot');
      if (step >= rounds) return finish();
      step++;
      if (step > rounds - 10) delay *= 1.28; // מאט לקראת הסוף
      setTimeout(hop, delay);
    }

    function finish() {
      chips.forEach((c, i) => { if (i !== winner) c.classList.add('dim'); });
      const name = players[winner];
      lastResult = { type: 'pick', name };

      const card = document.createElement('section');
      card.className = 'glass winner';
      card.innerHTML = '<small>הגורל בחר ב…</small><div class="who"></div>';
      card.querySelector('.who').textContent = name;
      showResult(card);

      setTimeout(() => {
        chips.forEach(c => { c.classList.remove('dim', 'hot'); c.style.animationDelay = ''; });
        panel.classList.remove('picking');
        busy = false; go.disabled = false;
      }, 2200);
    }
  }

  function showResult(el) {
    const r = document.getElementById('result');
    r.innerHTML = '';
    r.appendChild(el);
    document.getElementById('share').style.display = 'block';
    confetti();
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function shareWhatsApp() {
    if (!lastResult) return;
    let text;
    if (lastResult.type === 'teams') {
      text = 'הקבוצות שיצאו:\n\n' +
        lastResult.teams.map((m, i) => TEAM_STYLE[i].he + ': ' + m.join(', ')).join('\n') +
        '\n\nבהצלחה לכולם!';
    } else {
      text = 'הגורל החליט: ' + lastResult.name + '\nאין ערעורים.';
    }
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  /* קונפטי */
  function confetti() {
    const c = document.getElementById('confetti');
    const ctx = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    const colors = ['#c6ff3d', '#3de1ff', '#ff3d8b', '#8b5cff', '#ffffff'];
    const parts = Array.from({ length: 140 }, () => ({
      x: c.width / 2, y: c.height / 2,
      vx: (Math.random() - 0.5) * 16, vy: Math.random() * -16 - 4,
      size: Math.random() * 7 + 4, color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3
    }));
    let frame = 0;
    (function tick() {
      ctx.clearRect(0, 0, c.width, c.height);
      parts.forEach(p => {
        p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });
      if (++frame < 120) requestAnimationFrame(tick);
      else ctx.clearRect(0, 0, c.width, c.height);
    })();
  }

  render();
</script>
</body>
</html>
